<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      /privacy is a real page, not a duplicate of the homepage, so it ships its
      own canonical URL in the raw HTML. Google must never have to execute
      JavaScript to work out which URL should rank — that mismatch (this page
      served the homepage's canonical) is exactly what filed /privacy under
      "Alternate page with proper canonical tag" in Search Console.
    -->
    <link rel="canonical" href="https://hotelitoya.co.ke/privacy" />

    <!-- Primary SEO -->
    <title>Privacy Policy | Hotel Itoya, Busia Kenya</title>
    <meta name="description" content="How Hotel Itoya (Ayoti Group, B1 Kisumu-Busia Road, Busia, Kenya) collects, uses, stores and protects the personal information you share when you book a room, pay by M-Pesa or send us an enquiry." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Hotel Itoya — Ayoti Group" />

    <!-- Open Graph (Facebook, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hotelitoya.co.ke/privacy" />
    <meta property="og:title" content="Privacy Policy | Hotel Itoya, Busia Kenya" />
    <meta property="og:description" content="What personal information Hotel Itoya collects, why we collect it, and how it is handled." />
    <meta property="og:image" content="https://hotelitoya.co.ke/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Hotel Itoya exterior — Busia, Kenya" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:site_name" content="Hotel Itoya" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privacy Policy | Hotel Itoya, Busia Kenya" />
    <meta name="twitter:description" content="What personal information Hotel Itoya collects, why we collect it, and how it is handled." />
    <meta name="twitter:image" content="https://hotelitoya.co.ke/og-image.jpg" />
    <meta name="twitter:image:alt" content="Hotel Itoya exterior — Busia, Kenya" />

    <!-- Fonts — async to avoid render blocking (mirrors the homepage) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
